name: Deploy MindTown to Cloudflare
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'extension/**'
      - 'cloudflare/**'
      - 'tools/build-deploy.*'
      - 'tools/build-extension.py'
      - '.github/workflows/deploy-cloudflare.yml'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run native tests
        run: ./tools/test.sh
      - name: Build site and extension
        run: ./tools/build-deploy.sh
      - name: Check Cloudflare secrets
        id: cloudflare
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "$TOKEN" && -n "$ACCOUNT" ]]; then echo 'configured=true' >> "$GITHUB_OUTPUT"; else echo 'configured=false' >> "$GITHUB_OUTPUT"; fi
      - name: Deploy Worker and static assets
        if: steps.cloudflare.outputs.configured == 'true'
        run: npx --yes wrangler@4.114.0 deploy --config cloudflare/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Explain skipped deployment
        if: steps.cloudflare.outputs.configured != 'true'
        run: echo 'Cloudflare secrets are not configured; build and tests passed, deployment skipped.'
