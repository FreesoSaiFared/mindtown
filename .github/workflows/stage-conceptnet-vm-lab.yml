name: Stage ConceptNet VM Lab

on:
  push:
    branches:
      - lab/conceptnet-vm-staging-20260806-r5

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create staging tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/sources stage/data stage/provenance

      - name: Fetch pinned GitHub sources through gh-proxy
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" out="$2"
            echo "FETCH $url"
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
              --output "$out.part" "$url"
            mv "$out.part" "$out"
          }
          fetch 'https://gh-proxy.com/https://github.com/commonsense/conceptnet5/archive/fda1b39607ea6f07e41ddce22d9d5f8360ded581.tar.gz' \
            stage/sources/conceptnet5-fda1b39607ea.tar.gz
          fetch 'https://gh-proxy.com/https://github.com/JulesBelveze/concepcy/archive/79f9232befa62e67a95c88f6881444a88aaa3db7.tar.gz' \
            stage/sources/concepcy-79f9232befa6.tar.gz
          fetch 'https://gh-proxy.com/https://github.com/commonsense/conceptnet-numberbatch/archive/5559f04ccc9f6ff54684901f6ce99efede3fedfd.tar.gz' \
            stage/sources/conceptnet-numberbatch-5559f04ccc9f.tar.gz
          fetch 'https://gh-proxy.com/https://github.com/mrdoob/three.js/archive/refs/tags/r184.tar.gz' \
            stage/sources/three-r184.tar.gz
          fetch 'https://gh-proxy.com/https://github.com/playcanvas/engine/archive/refs/tags/v2.18.1.tar.gz' \
            stage/sources/playcanvas-engine-v2.18.1.tar.gz

      - name: Fetch bounded Numberbatch English and Dutch data
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" out="$2"
            echo "FETCH $url"
            curl --fail --location --retry 5 --retry-all-errors --connect-timeout 20 \
              --output "$out.part" "$url"
            mv "$out.part" "$out"
          }
          fetch 'https://zenodo.org/records/4911598/files/numberbatch-19.08-en.zip?download=1' \
            stage/data/numberbatch-19.08-en.zip
          fetch 'https://zenodo.org/records/4911598/files/numberbatch-19.08-nl.zip?download=1' \
            stage/data/numberbatch-19.08-nl.zip

      - name: Record provenance and verify archives
        shell: bash
        run: |
          set -euo pipefail
          cat > stage/provenance/SOURCES.txt <<'EOF'
          conceptnet5 fda1b39607ea6f07e41ddce22d9d5f8360ded581 via gh-proxy
          concepcy 79f9232befa62e67a95c88f6881444a88aaa3db7 via gh-proxy
          conceptnet-numberbatch 5559f04ccc9f6ff54684901f6ce99efede3fedfd via gh-proxy
          three.js r184 via gh-proxy
          playcanvas engine v2.18.1 via gh-proxy
          Numberbatch 19.08 filtered English/Dutch files from Zenodo record 4911598
          EOF
          find stage/sources -name '*.tar.gz' -print0 | xargs -0 -n1 tar -tzf >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for path in sorted(Path('stage/data').glob('*.zip')):
              with zipfile.ZipFile(path) as zf:
                  assert zf.infolist(), path
                  for info in zf.infolist():
                      if not info.is_dir():
                          with zf.open(info) as f:
                              f.read(4096)
                  print(path, [(i.filename, i.file_size, i.compress_type) for i in zf.infolist()])
          PY
          (cd stage && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          du -h stage/sources/* stage/data/* | tee stage/provenance/SIZES.txt

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: conceptnet-vm-lab-inputs-20260806
          path: stage
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
